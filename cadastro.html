
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar Conta | Magnani Imóveis</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #b5121b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .logo {
            color: white;
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 25px;
        }

        .logo span {
            display: block;
            font-size: 14px;
            font-weight: normal;
            margin-top: 8px;
            opacity: 0.9;
        }

        .container {
            width: 100%;
            max-width: 460px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.2);
        }

        h1 {
            font-size: 25px;
            color: #222;
            margin-bottom: 8px;
        }

        .descricao {
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .campo {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        input, select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
            background: white;
        }

        input:focus, select:focus {
            border-color: #b5121b;
            box-shadow: 0 0 0 3px rgba(181, 18, 27, 0.1);
        }

        .botao {
            width: 100%;
            padding: 14px;
            margin-top: 5px;
            border: none;
            border-radius: 7px;
            background: #b5121b;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .botao:hover {
            background: #850d14;
        }

        .mensagem {
            display: none;
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 7px;
            font-size: 14px;
            line-height: 1.5;
        }

        .erro {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .sucesso {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .login {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #666;
        }

        .login a {
            color: #b5121b;
            text-decoration: none;
            font-weight: bold;
        }

        .login a:hover {
            text-decoration: underline;
        }

        .rodape {
            margin-top: 22px;
            color: white;
            font-size: 12px;
            text-align: center;
            opacity: 0.85;
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px 20px;
            }

            .logo {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

    <div class="logo">
        Magnani Imóveis
        <span>Sistema interno da imobiliária</span>
    </div>

    <main class="container">

        <h1>Criar conta</h1>

        <p class="descricao">
            Preencha os dados abaixo para criar seu acesso ao sistema.
        </p>

        <div id="mensagem" class="mensagem" role="status"></div>

        <form id="formCadastro">

            <div class="campo">
                <label for="nome">Nome completo</label>
                <input
                    type="text"
                    id="nome"
                    placeholder="Digite seu nome completo"
                    required
                    autocomplete="name"
                >
            </div>

            <div class="campo">
                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    required
                    autocomplete="email"
                >
            </div>

            <div class="campo">
                <label for="cargo">Cargo</label>
                <select id="cargo" required>
                    <option value="">Selecione seu cargo</option>
                    <option value="Administrador">Administrador</option>
                    <option value="Angariador">Angariador</option>
                    <option value="Corretor">Corretor</option>
                    <option value="Atendimento">Atendimento</option>
                    <option value="Outro">Outro</option>
                </select>
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    placeholder="Crie uma senha"
                    minlength="6"
                    required
                    autocomplete="new-password"
                >
            </div>

            <div class="campo">
                <label for="confirmarSenha">Confirmar senha</label>
                <input
                    type="password"
                    id="confirmarSenha"
                    placeholder="Digite a senha novamente"
                    minlength="6"
                    required
                    autocomplete="new-password"
                >
            </div>

            <button type="submit" class="botao">
                Criar minha conta
            </button>

        </form>

        <div class="login">
            Já possui uma conta?
            <a href="login.html">Fazer login</a>
        </div>

    </main>

    <div class="rodape">
        Magnani Imóveis &copy; 2026
    </div>

    <script>
        const form = document.getElementById("formCadastro");
        const mensagem = document.getElementById("mensagem");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const nome = document.getElementById("nome").value.trim();
            const email = document.getElementById("email")
                .value.trim().toLowerCase();
            const cargo = document.getElementById("cargo").value;
            const senha = document.getElementById("senha").value;
            const confirmarSenha =
                document.getElementById("confirmarSenha").value;

            mensagem.className = "mensagem";
            mensagem.textContent = "";

            if (senha.length < 6) {
                mostrarMensagem(
                    "A senha deve possuir pelo menos 6 caracteres.",
                    "erro"
                );
                return;
            }

            if (senha !== confirmarSenha) {
                mostrarMensagem(
                    "As senhas digitadas não são iguais.",
                    "erro"
                );
                return;
            }

            const usuarios = JSON.parse(
                localStorage.getItem("magnani_usuarios") || "[]"
            );

            const usuarioExistente = usuarios.some(
                usuario => usuario.email === email
            );

            if (usuarioExistente) {
                mostrarMensagem(
                    "Este e-mail já está cadastrado neste navegador.",
                    "erro"
                );
                return;
            }

            const novoUsuario = {
                id: Date.now(),
                nome: nome,
                email: email,
                cargo: cargo,
                senha: senha
            };

            usuarios.push(novoUsuario);

            localStorage.setItem(
                "magnani_usuarios",
                JSON.stringify(usuarios)
            );

            mostrarMensagem(
                "Cadastro realizado! Redirecionando para o login...",
                "sucesso"
            );

            form.reset();

            setTimeout(function() {
                window.location.href = "login.html";
            }, 1500);
        });

        function mostrarMensagem(texto, tipo) {
            mensagem.textContent = texto;
            mensagem.className = "mensagem " + tipo;
        }
    </script>

</body>
</html>
