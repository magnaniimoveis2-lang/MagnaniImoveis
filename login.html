
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Magnani Imóveis</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #b5121b;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .logo {
            color: white;
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 25px;
        }

        .logo span {
            display: block;
            font-size: 14px;
            font-weight: normal;
            margin-top: 8px;
            opacity: 0.9;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 440px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.2);
            border-top: 5px solid #850d14;
        }

        h1 {
            color: #222;
            font-size: 26px;
            margin-bottom: 8px;
        }

        .descricao {
            color: #777;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .campo {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #333;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #b5121b;
            box-shadow: 0 0 0 3px rgba(181, 18, 27, 0.1);
        }

        .senha-container {
            position: relative;
        }

        .senha-container input {
            padding-right: 75px;
        }

        .mostrar-senha {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #b5121b;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .botao {
            width: 100%;
            padding: 14px;
            background: #b5121b;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .botao:hover {
            background: #850d14;
        }

        .botao:disabled {
            opacity: 0.7;
            cursor: wait;
        }

        .mensagem {
            display: none;
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 7px;
            font-size: 14px;
            line-height: 1.5;
        }

        .erro {
            display: block;
            color: #991b1b;
            background: #fee2e2;
        }

        .sucesso {
            display: block;
            color: #166534;
            background: #dcfce7;
        }

        .cadastro {
            text-align: center;
            margin-top: 23px;
            font-size: 14px;
            color: #666;
        }

        .cadastro a {
            color: #b5121b;
            text-decoration: none;
            font-weight: bold;
        }

        .cadastro a:hover {
            text-decoration: underline;
        }

        .rodape {
            margin-top: 22px;
            color: white;
            font-size: 12px;
            text-align: center;
            opacity: 0.85;
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px 20px;
            }

            .logo {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

    <div class="logo">
        Magnani Imóveis
        <span>Sistema interno da imobiliária</span>
    </div>

    <main class="container">

        <h1>Bem-vindo!</h1>

        <p class="descricao">
            Entre com seus dados para acessar o sistema da imobiliária.
        </p>

        <div
            id="mensagem"
            class="mensagem"
            role="status"
            aria-live="polite">
        </div>

        <form id="formLogin">

            <div class="campo">
                <label for="email">E-mail</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    autocomplete="username"
                    required>
            </div>

            <div class="campo">
                <label for="senha">Senha</label>

                <div class="senha-container">
                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required>

                    <button
                        type="button"
                        class="mostrar-senha"
                        id="mostrarSenha">
                        Mostrar
                    </button>
                </div>
            </div>

            <button type="submit" class="botao" id="botaoEntrar">
                Entrar no sistema
            </button>

        </form>

        <div class="cadastro">
            Ainda não possui uma conta?
            <a href="cadastro.html">Criar conta</a>
        </div>

    </main>

    <div class="rodape">
        Magnani Imóveis &copy; 2026
    </div>

    <script>
        const form = document.getElementById("formLogin");
        const mensagem = document.getElementById("mensagem");
        const campoEmail = document.getElementById("email");
        const campoSenha = document.getElementById("senha");
        const botaoEntrar = document.getElementById("botaoEntrar");

        // Mostrar ou ocultar a senha
        document.getElementById("mostrarSenha")
            .addEventListener("click", function() {

                if (campoSenha.type === "password") {
                    campoSenha.type = "text";
                    this.textContent = "Ocultar";
                } else {
                    campoSenha.type = "password";
                    this.textContent = "Mostrar";
                }
            });

        // Validar o login
        form.addEventListener("submit", function(event) {
            event.preventDefault();

            mensagem.className = "mensagem";
            mensagem.textContent = "";

            const email = campoEmail.value.trim().toLowerCase();
            const senha = campoSenha.value;

            const usuarios = JSON.parse(
                localStorage.getItem("magnani_usuarios") || "[]"
            );

            const usuario = usuarios.find(function(item) {
                return item.email.toLowerCase() === email
                    && item.senha === senha;
            });

            if (!usuario) {
                mensagem.className = "mensagem erro";
                mensagem.textContent =
                    "E-mail ou senha incorretos. Confira os dados ou crie uma conta.";

                return;
            }

            // Guardar a sessão do usuário neste navegador
            sessionStorage.setItem(
                "magnani_usuario_logado",
                JSON.stringify({
                    id: usuario.id,
                    nome: usuario.nome,
                    email: usuario.email,
                    cargo: usuario.cargo
                })
            );

            mensagem.className = "mensagem sucesso";
            mensagem.textContent =
                "Login realizado! Abrindo o sistema...";

            botaoEntrar.disabled = true;
            botaoEntrar.textContent = "Entrando...";

            setTimeout(function() {
                window.location.href = "pastas.html";
            }, 800);
        });
    </script>

</body>
</html>
